<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111427"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="description" content="Aryan Game: interactive mobile-friendly Phases 1–4 demo"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>Aryan Game — Four Phase Demo</title>
<style>
:root{color-scheme:dark;--bg:#0a0d1c;--surface:#131a31;--surface2:#1c2847;--line:#354465;--text:#f7f5ee;--sub:#b3bfd9;--accent:#ff725b;--gold:#ffd36a;--green:#72dfb0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 70% -10%,#33315f,transparent 45%),var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:1px solid #63708d;background:#273454;color:var(--text);padding:11px 18px;cursor:pointer;border-radius:13px;font-weight:700}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}button.primary{background:linear-gradient(115deg,#d34851,#fa835c);border-color:#ff926c;color:#fff}button.ghost{background:transparent}button:disabled{opacity:.5;cursor:default}.wrap{max-width:1060px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #303b5e;background:#11182bbd;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.brand{font-size:clamp(20px,4vw,30px);font-weight:1000;letter-spacing:2px}.brand span{color:var(--accent)}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{padding:9px 12px}.eyebrow{text-transform:uppercase;color:var(--gold);letter-spacing:3px;font-size:11px;font-weight:800}.hero{padding:40px 6px 20px}.hero h1{font-size:clamp(34px,8vw,70px);line-height:1.04;margin:10px 0;max-width:850px}.hero p{max-width:690px;color:var(--sub);line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.panel{background:linear-gradient(135deg,#1c2842,#11182b);border:1px solid #344461;border-radius:20px;padding:20px;box-shadow:0 10px 30px #0003}.panel h2,.panel h3{margin:6px 0 12px}.muted{color:var(--sub)}.tag{display:inline-flex;align-items:center;border:1px solid #59627f;background:#293956;border-radius:100px;font-size:12px;padding:5px 10px;margin:0 5px 5px 0;color:#e3e8fb}.section{margin:22px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.stat{font-size:13px;color:#cad3e7}.stat b{color:white;font-size:19px}.avatar{font-size:55px;line-height:1.2}.select-card{position:relative;text-align:left;width:100%;min-height:145px}.select-card.active{border-color:var(--gold);background:#433953}.select-card .check{position:absolute;right:14px;top:13px;font-size:20px}.arena{height:clamp(220px,44vh,340px);position:relative;overflow:hidden;border-radius:19px;border:2px solid #526485;background:linear-gradient(#263558 0%,#24485b 61%,#3c4039 62%,#1f312f 100%)}.arena:before{content:'☁          ☾                  ☁';white-space:pre;position:absolute;inset:15px 0 auto;text-align:center;font-size:28px;opacity:.33}.fighter{position:absolute;bottom:42px;font-size:clamp(65px,13vw,102px);filter:drop-shadow(4px 9px 0 #0005);transition:left .15s}.foe{position:absolute;right:9%;bottom:42px;font-size:clamp(59px,12vw,95px);filter:drop-shadow(6px 8px 0 #0005);transform-origin:bottom}.friend{position:absolute;bottom:24px;font-size:clamp(25px,5vw,43px);opacity:.9}.bar{height:10px;background:#35415b;border-radius:9px;overflow:hidden;min-width:90px;flex:1}.bar>div{height:100%;background:var(--green);transition:width .15s}.bar.danger>div{background:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent);height:28px}input[type=time],select{background:#293754;color:#fff;border:1px solid #627393;border-radius:11px;padding:10px;max-width:100%}.pill{background:#283653;border-radius:12px;padding:9px 13px}.log{min-height:40px;color:#ffd697}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:15px}.progress div{height:6px;border-radius:10px;background:#344562}.progress .done{background:var(--accent)}.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.room{background:radial-gradient(circle at top,#465071,#232b49);border-radius:16px;padding:25px;min-height:185px;display:grid;place-items:center;text-align:center}.room strong{font-size:48px}.room span{display:block;color:var(--gold)}footer{color:#8591b1;border-top:1px solid #2f3e5d;margin-top:40px;font-size:12px;padding:20px 0}.birth{font-size:96px;text-align:center;animation:float 2s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-12px) scale(1.05)}}@media(max-width:600px){header{position:static}.wrap{padding:12px}header .wrap{display:block}nav{margin-top:9px}.panel{padding:14px}.hero{padding:23px 3px}.actions button{flex:1}}
@media(orientation:portrait) and (max-width:700px){.landscape{display:block;background:#253955;border:1px solid #637fa6;border-radius:10px;padding:8px;font-size:12px;margin:8px 0}}@media(orientation:landscape){.landscape{display:none}}
</style></head><body><header><div class="wrap row space" style="width:100%"><div class="brand">⚔ ARY<span>AN</span> <small style="font-size:10px;letter-spacing:0">DEMO</small></div><nav><button class="ghost" onclick="home()">Phases</button><button class="ghost" onclick="openRoster()">Roster</button><button class="ghost" id="installBtn" onclick="installGame()">Install</button></nav></div></header><main class="wrap" id="app"></main><footer><div class="wrap">Aryan Game · Phases 1–4 prototype · Unfinished mechanics and artwork are placeholders · Progress stays on this device</div></footer>
<script>
'use strict';
const $=x=>document.querySelector(x), APP=$('#app');
const roster=['Atiqueulla','Sharif','Isfak','Masud','Ariful','Imran','Merazul','Bapu'];
const emoji=['🧑🏽','🧑🏻','🧑🏾','🧑','🧑🏿','🧑🏽‍✈️','🧑🏻‍💻','🧔'];
const items=[['Alcohol',30],['Beer',10],['Joint',25],['Bong',35],['Cigarettes',5],['Girls',34]];
const caps={'Atiqueulla':[0,0,1,1,1,10],'Sharif':[8,9,0.5,0,8,4],'Isfak':[7,8,9,8,10,10],'Masud':[5,5,1,0,5,3],'Ariful':[0,0,0,0,1,0],'Imran':[5,5,0,0,5,2],'Merazul':[0,0,0,0,0,0],'Bapu':[1,1,1,1,1,1]};
const npcs=[
{name:'Alok',wake:'08:00',bed:'02:00',intro:'Regular college days; weekend girlfriend visit.',avatar:'🧑🏽'},
{name:'Ahanaf Parvez Ahmed (APA)',wake:'09:00',bed:'03:00',intro:'One morning bong shot, study, college and flexible weekends.',avatar:'🧑🏻‍🎓'},
{name:'Farhan · Political Glitch',wake:'08:00',bed:'02:00',intro:'College 2–3 variable days each week; usually orders food online.',avatar:'🧑🏾'},
{name:'Debasis Dutta · Datta',wake:'09:30',bed:'02:00',intro:'Always attends weekday college; codes through weekends.',avatar:'👨🏻‍💻'}
];
let page='home',selected=['Atiqueulla','Sharif','Isfak'],up={},player={hp:100,x:12},enemy={hp:100,number:1},message='',damageTotal=0,runEnded=false,installEvent=null;
const getSaved=()=>{try{return JSON.parse(localStorage.getItem('aryan_upgrades')||'{}')}catch{return {}}};
up=getSaved();
const done=()=>localStorage.getItem('aryan_phase1_finished')==='yes';
const save=()=>localStorage.setItem('aryan_upgrades',JSON.stringify(up));
function tag(s){return '<span class="tag">'+s+'</span>'}
function home(){page='home';APP.innerHTML='<div class="hero"><div class="eyebrow">A world built around Aryan</div><h1>Four phases.<br>One evolving story.</h1><p>Start with Aryan\'s birth, recruit teammates, fight 100 enemies, experiment with fictional upgrades, and explore the hostel-life simulation. Select a phase to play a working prototype.</p><div class="actions"><button class="primary" onclick="beginIntro()">▶ New Game</button><button onclick="openRoster()">Meet the characters</button></div><p class="landscape">↻ Rotate your phone to landscape for the intended game layout.</p></div><div class="grid">'+[
['01','The Battleground','Character selection, touch movement and 100 sequential enemies.','beginIntro()'],
['02','Repair & Upgrade','Explore character-specific limits and enhancement inventory.','enhance()'],
['03','Team Missions','An interactive mission-planning placeholder, awaiting final mechanics.','missions()'],
['04','Hostel Simulation',done()?'Unlocked · preview AI character schedules.':'Locked · finish one Phase 1 run (win or lose).','hostel()']
].map(p=>'<div class="panel"><div class="eyebrow">Phase '+p[0]+'</div><h2>'+p[1]+'</h2><p class="muted">'+p[2]+'</p><button onclick="'+p[3]+'" '+(p[0]==='04'&&!done()?'disabled':'')+'>Open phase →</button></div>').join('')+'</div><div class="panel section"><b>Saved progress:</b> '+(done()?'Phase 1 playthrough completed ✓':'Phase 1 not completed')+' · Upgrades saved locally · Placeholder artwork</div>'}
function openRoster(){page='roster';APP.innerHTML='<div class="eyebrow">Character roster</div><h1>Aryan and his crew</h1><p class="muted">Temporary avatars. A player can recruit four of the eight companions in this demo.</p><div class="grid"><div class="panel"><div class="avatar">🦸</div><h3>Aryan</h3><span class="tag">Main character</span><p class="muted">Born 16 January 2002 · frontline fighter · 100 HP</p></div>'+roster.map((n,i)=>'<div class="panel"><div class="avatar">'+emoji[i]+'</div><h3>'+n+'</h3><span class="tag">Support character</span><p class="muted">'+(n==='Isfak'?'Intelligence + special combo':n==='Merazul'?'Usually refuses assistance':n==='Imran'?'Can drive a car':n==='Bapu'?'Rage trigger':n==='Ariful'?'Angry temperament':'Distinct abilities under development')+'</p></div>').join('')+'</div><div class="actions"><button class="primary" onclick="beginIntro()">New Game</button><button onclick="home()">Back</button></div>'}
function beginIntro(){page='intro';APP.innerHTML='<div class="panel" style="max-width:650px;margin:35px auto;text-align:center"><div class="eyebrow">Chapter zero · the beginning</div><h1>16 January 2002</h1><div class="birth">👶</div><h2>Aryan is born.</h2><p class="muted">The story starts here.</p><button class="primary" onclick="pickTeam()">Continue to team selection →</button></div>';setTimeout(()=>{if(page==='intro')pickTeam()},5000)}
function pickTeam(){page='pick';APP.innerHTML='<div class="eyebrow">Phase 1 · Recruitment</div><h1>Choose four teammates</h1><p class="muted">Aryan fights at the front, with selected teammates supporting from behind. The winning synergy is Aryan + Atiqueulla + Isfak + Sharif.</p><div class="grid">'+roster.map((n,i)=>'<button class="panel select-card '+(selected.includes(n)?'active':'')+'" onclick="selectMate('+i+')"><div class="check">'+(selected.includes(n)?'✓':'○')+'</div><div class="avatar">'+emoji[i]+'</div><h3>'+n+'</h3></button>').join('')+'</div><div class="actions"><span class="pill" id="picked">'+selected.length+'/4 selected</span><button class="primary" onclick="startBattle()">Enter battlefield →</button></div>'; }
function selectMate(i){const n=roster[i];if(selected.includes(n)){selected=selected.filter(x=>x!==n)}else if(selected.length<4){selected.push(n)}else{alert('You can select only four teammates.');return}pickTeam()}
function tier(){return enemy.number<=33?1:enemy.number<=66?2:3}
function enemyMax(){return 70+(tier()-1)*25}
function startBattle(){page='battle';runEnded=false;player={hp:100,x:12};enemy={number:1,hp:70};damageTotal=0;message='Aryan enters the battleground.';battle()}
function battle(){if(page!=='battle')return;const level=tier(),winCombo=['Atiqueulla','Isfak','Sharif'].every(n=>selected.includes(n));const pct=Math.min(100,Math.max(0,player.hp));APP.innerHTML='<div class="eyebrow">Phase 1 · The battleground</div><h1>Wave '+enemy.number+' / 100 <span class="tag">Tier '+level+'</span></h1><div class="row space"><div class="stat">🦸 Aryan · HP <b>'+Math.max(0,player.hp)+'/100</b></div><div class="stat">👹 Enemy · HP <b>'+Math.max(0,enemy.hp)+'/'+enemyMax()+'</b></div></div><div class="row"><div class="bar"><div style="width:'+pct+'%"></div></div><div class="bar danger"><div style="width:'+Math.min(100,100*enemy.hp/enemyMax())+'%"></div></div></div><p class="muted">Wave tier raises enemy size by approximately 10%. Enemy HP and damage also increase.</p><div class="arena"><div class="friend" style="left:4%">👥</div><div class="fighter" id="fighter" style="left:'+player.x+'%">🦸</div><div class="foe" style="transform:scale('+(1+(level-1)*.1)+')">👹</div></div><label for="move">Slide to move Aryan left / right</label><input id="move" type="range" min="5" max="55" value="'+player.x+'" oninput="moveHero(this.value)"><div class="row"><span class="tag">Support: '+(selected.join(', ')||'none')+'</span>'+(winCombo?tag('Team synergy ready'):tag('No combo synergy'))+'</div><div class="actions"><button class="primary" onclick="strike(\'normal\')">⚔ Attack</button><button onclick="strike(\'special\')">✨ Special</button><button onclick="strike(\'combo\')" '+(!winCombo?'disabled':'')+'>🔥 Team combo</button><button onclick="strike(\'auto\')">⚡ Quick 10 hits</button></div><p class="log" aria-live="polite">'+message+'</p><p class="muted">Lose or defeat all enemies to complete one playthrough and unlock Phase 4. This battle uses prototype balancing.</p><button class="ghost" onclick="home()">Leave run (does not count)</button>'}
function moveHero(n){player.x=Number(n);const f=$('#fighter');if(f)f.style.left=n+'%'}
function strike(kind){if(page!=='battle')return;let hits=kind==='auto'?10:1;for(let i=0;i<hits;i++){const synergy=['Atiqueulla','Isfak','Sharif'].every(n=>selected.includes(n));let power=kind==='normal'?24:kind==='special'?38:kind==='combo'&&synergy?68:kind==='auto'?26:24;let bonus=Math.min(22,Object.values(up).reduce((sum,x)=>sum+x,0)*2);enemy.hp-=power+bonus;damageTotal+=power+bonus;if(enemy.hp<=0){enemy.number++;if(enemy.number>100){finishRun(true);return}enemy.hp=enemyMax();player.hp=Math.min(100,player.hp+6);message='Enemy defeated! Aryan advances.'}else{let retaliation=Math.max(2,7+(tier()-1)*3-selected.length);player.hp-=retaliation}if(player.hp<=0){finishRun(false);return}}battle()}
function finishRun(won){page='ended';localStorage.setItem('aryan_phase1_finished','yes');APP.innerHTML='<div class="panel" style="text-align:center;margin:45px auto;max-width:650px"><div class="avatar">'+(won?'🏆':'🛡️')+'</div><div class="eyebrow">Phase 1 · Run complete</div><h1>'+(won?'Victory!':'Aryan was defeated')+'</h1><p>You reached wave '+Math.min(100,enemy.number)+' of 100 and dealt '+damageTotal+' points of damage.</p><p class="muted">Phase 4 is now unlocked. Winning is not required to unlock it.</p><div class="actions"><button class="primary" onclick="hostel()">Visit Phase 4</button><button onclick="enhance()">Upgrade Team</button><button onclick="beginIntro()">Replay</button><button onclick="home()">All Phases</button></div></div>'}
function enhance(){page='enhance';let total=Object.values(up).reduce((s,v)=>s+v,0);APP.innerHTML='<div class="eyebrow">Phase 2 · Enhancement lab</div><h1>Repair & Upgrade</h1><p class="muted">Fictional game power-ups use your supplied percentages and character caps. Actual buffs in combat are scaled for playable balance; real-world effects are not implied.</p><div class="panel"><div class="row"><label>Character <select id="enhChar" onchange="drawEnhTable()">'+roster.map(x=>'<option>'+x+'</option>').join('')+'</select></label><span class="pill">Total equipped: '+total+'</span></div><div id="enhTable"></div></div><div class="panel section"><h2>Conversation preview</h2><p>Aryan: “Are you ready for the next phase?”</p><p class="muted">Your scripted dialogue and answer choices will replace this example.</p><button onclick="missions()">Next · Phase 3</button></div>';drawEnhTable()}
function drawEnhTable(){let n=$('#enhChar').value;let key=k=>n+'|'+k;$('#enhTable').innerHTML='<div class="grid">'+items.map((x,i)=>{const limit=caps[n][i];const value=up[key(x[0])]||0;return '<div class="panel"><div class="eyebrow">Game item · '+x[1]+'% nominal</div><h3>'+x[0]+'</h3><p>Equipped '+value+' / '+limit+'</p><div class="row"><button onclick="adjust(\''+n+'\',\''+x[0]+'\',-1)">−</button><button onclick="adjust(\''+n+'\',\''+x[0]+'\',1)">+</button></div></div>'}).join('')+'</div><p class="muted">Special abilities and item restrictions are demo values. Merazul has no specified item caps, so upgrades are disabled pending your instructions.</p>'}
function adjust(n,item,delta){const i=items.findIndex(x=>x[0]===item);const k=n+'|'+item;const lim=caps[n][i];up[k]=Math.max(0,Math.min(lim,Math.round(((up[k]||0)+delta)*2)/2));save();drawEnhTable()}
function missions(){page='missions';APP.innerHTML='<div class="eyebrow">Phase 3 · Prototype</div><h1>Team Missions</h1><p class="muted">Phase 3 mechanics have not yet been fully described. This stage demonstrates the interface and navigation, not invented final rules.</p><div class="panel"><h2>Mission briefing</h2><p>Choose a crew for your next mission.</p><div class="grid">'+roster.map((n,i)=>'<div class="panel"><div class="avatar">'+emoji[i]+'</div><b>'+n+'</b><p class="muted">Character placeholder</p></div>').join('')+'</div><div class="actions"><button onclick="enhance()">← Phase 2</button><button class="primary" onclick="hostel()">Continue → Phase 4</button></div></div>'}
function hostel(){if(!done()){APP.innerHTML='<div class="panel"><h1>Phase 4 locked</h1><p>Finish one Phase 1 playthrough first. Winning is not required.</p><button class="primary" onclick="beginIntro()">Play Phase 1</button></div>';return}page='hostel';APP.innerHTML='<div class="eyebrow">Phase 4 · Hostel life</div><h1>Campus & hostel simulation</h1><p class="muted">Prototype NPC schedules based on the routines you described. Weekday college finishes at 3 PM; offline routines can later be overridden by real players.</p><div class="panel"><div class="row"><label>Character <select id="npc" onchange="showSchedule()">'+npcs.map((n,i)=>'<option value="'+i+'">'+n.name+'</option>').join('')+'</select></label><label>Day <select id="day" onchange="showSchedule()"><option value="weekday">Weekday</option><option value="weekend">Weekend</option></select></label><label>Time <input type="time" id="hour" value="09:00" onchange="showSchedule()"></label><button class="primary" onclick="showSchedule()">Simulate</button></div><div id="routine"></div></div><h2 class="section">Resident cards</h2><div class="grid">'+npcs.map(n=>'<div class="panel"><div class="avatar">'+n.avatar+'</div><h3>'+n.name+'</h3><span class="tag">Wake: '+n.wake+'</span><span class="tag">Bed: '+n.bed+'</span><p class="muted">'+n.intro+'</p></div>').join('')+'</div>';showSchedule()}
function showSchedule(){if(page!=='hostel')return;const who=Number($('#npc').value),n=npcs[who],weekend=$('#day').value==='weekend',time=$('#hour').value,h=Number(time.slice(0,2))+Number(time.slice(3))/60;let where='Hostel room',activity='',art='🛏️';if(who===0){if(h>=9&&h<9.5){where='Canteen';activity='Morning meal';art='🍽️'}else if(!weekend&&h>=9.5&&h<15){where='College';activity='Attending classes';art='🏫'}else if(weekend&&h>=12&&h<15){where='Outside campus';activity='Meeting his girlfriend';art='🚶'}else if(h>=21&&h<21.5){where='Canteen';activity='Evening meal';art='🍽️'}else if(h>=8||h<2){activity='Phone and room recreation';art='📱'}else{activity='Sleeping';art='😴'}}else if(who===1){if(!weekend&&h>=9.5&&h<15){where='College';activity='Classes';art='🏫'}else if(h>=9&&h<9.5){activity='Morning routine and study';art='📚'}else if(weekend&&h>=12&&h<20){activity='Flexible: party or relax in room';art='🎉'}else if(h>=21&&h<21.5){where='Canteen';activity='Evening meal';art='🍽️'}else if(h>=15||h<3){activity='Room recreation';art='🛋️'}else{activity='Sleeping';art='😴'}}else if(who===2){if(!weekend&&h>=9.5&&h<15){where='College or hostel';activity='College on 2–3 variable days per week';art='📆'}else if(h>=9&&h<9.5||h>=21&&h<21.5){activity='Usually orders food online';art='🥡'}else if(h>=8||h<2){activity='Room recreation';art='📱'}else{activity='Sleeping';art='😴'}}else{if(weekend){activity='Coding on laptop, with room breaks';art='💻'}else if(h>=9.5&&h<15){where='College';activity='Attending all scheduled classes';art='🏫'}else if(h>=9&&h<9.5){activity='Wake-up routine';art='☀️'}else if(h>=15||h<2){activity='Back in hostel';art='💻'}else{activity='Sleeping';art='😴'}}$('#routine').innerHTML='<div class="room section"><strong>'+art+'</strong><div><h2>'+n.name+'</h2><span>'+where+' · '+time+'</span><p>'+activity+'</p></div></div><p class="muted">Game AI schedule preview only. No multiplayer login or server-controlled NPCs in this prototype.</p>'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});async function installGame(){if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null}else alert('Use your browser menu and choose “Add to Home screen” or “Install app”. On iPhone, use Share → Add to Home Screen.')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
home();
</script></body></html>
